services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_governance
      POSTGRES_USER: agent_governance
      POSTGRES_PASSWORD: agent_governance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_governance -d agent_governance"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  backend:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://agent_governance:agent_governance@postgres:5432/agent_governance
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
