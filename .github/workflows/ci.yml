name: Platform Continuous Integration

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-ci:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv pip install --system -e "agent-security[dev]" fastapi uvicorn[standard] sqlalchemy[asyncio] asyncpg redis alembic pydantic-settings httpx

      - name: Run Pytest Suite
        run: |
          cd agent-security
          pytest -v

  frontend-ci:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        run: |
          cd dashboard
          npm ci

      - name: TypeScript Type Check
        run: |
          cd dashboard
          npx tsc --noEmit

      - name: ESLint
        run: |
          cd dashboard
          npm run lint

      - name: Production Build
        run: |
          cd dashboard
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
