[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-security"
version = "0.1.0"
description = "Autonomous AI Agent Security & Runtime Governance Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
